# Verification worker config (docs/workers.md). Recipes are defined HERE, on the worker. The orchestrator only names one.
server = "https://factory.example.internal:8788"   # the worker API (through TLS, a VPN or: ssh -L 8788:127.0.0.1:8788 factory-host)
token_file = "~/.factory-worker-token"             # the token the operator generated for this worker (mode 0600)
platform = "macos"                                 # matched against [[workers.checks]] platform ("any" jobs match every worker)
poll_seconds = 5
git_url = "https://github.com/{repo}.git"           # this machine's own git credentials (a read-only token) are used to clone
work_dir = "~/factory-work"

[recipes.ios-test]
# An argv, never a shell string. Put the script OUTSIDE the checkout: anything inside it was written by an agent.
command = ["/Users/factory/recipes/ios-test.sh"]
timeout_seconds = 3600
artifacts = ["build/screens/*.png"]                # PNG globs relative to the checkout; returned and shown in the admin UI
env_passthrough = []                               # the only extra environment variables the recipe can see

[recipes.web-test]
# Ships with the factory: installs with the lockfile, builds, tests, and runs Playwright if the project has it. Copy worker/recipes/ to
# the worker (outside any checkout). Add "--dir", "web" for a project in a subfolder, "--no-playwright" to skip browser tests.
command = ["/Users/factory/recipes/web-test.sh"]
timeout_seconds = 1800
artifacts = ["test-results/**/*.png"]              # Playwright failure screenshots; images over 1600x6000 are dropped, not fatal

[recipes.android-test]
# Builds and tests inside the factory-android container (sandbox/android/), so the SDK is not installed on this machine and the
# agent-written project never runs on it directly. Add "--emulator" (Linux with /dev/kvm, image built with WITH_EMULATOR=1) for
# connected tests, "--dir", "app" for a subfolder, "--task", ":app:testDebugUnitTest" for a specific Gradle task.
command = ["/home/factory/recipes/android-test.sh"]
timeout_seconds = 3600
artifacts = ["build/screens/*.png"]                # the emulator's final screenshot

[recipes.android-screens]
# The Screens board's Build screens for an Android project: records the project's Roborazzi or Paparazzi screenshots (JVM tests, no
# emulator) in the same container and returns one per test. Add "--emulator" to run connectedDebugAndroidTest instead.
command = ["/home/factory/recipes/android-test.sh", "--screens"]
timeout_seconds = 3600
artifacts = ["screens-out/*.png"]

[recipes.ios-test]
# A Mac with Tart (brew install cirruslabs/cli/tart) and a golden Xcode VM named shikumi-ios (docs/workers.md, "iOS golden image").
# Builds and tests in a throwaway macOS VM, simulator only, code signing off. One recipe per project: the arguments are fixed here.
command = ["/Users/factory/recipes/ios-test.sh", "--scheme", "App", "--project", "App.xcodeproj"]
# command = [".../ios-test.sh", "--scheme", "App", "--workspace", "App.xcworkspace", "--destination", "platform=iOS Simulator,name=iPhone 15 Pro"]
timeout_seconds = 3600
artifacts = ["build/screens/*.png"]                # the simulator's final screenshot

[recipes.smell-scan]
# Code-smell scans (docs/scanner.md). Reads files only; never runs the repository's code. Needs python3 on this machine.
command = ["/home/factory/recipes/smell-scan.py"]
timeout_seconds = 600
