[package]
name = "shikumi-cli"
version = "0.0.0"           # the real version is the repository's VERSION file (build.rs), so a release only bumps that
edition = "2021"
rust-version = "1.85"
publish = false
license = "MIT"
description = "Command-line client for a Shikumi software factory"

[[bin]]
name = "shikumi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
