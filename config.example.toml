# Shikumi example configuration. Copy to config.toml and edit. Paths assume the native install
# under /srv/factory; the docker-compose stack maps the same paths (see README).

[general]
db_path = "/srv/factory/state/factory.db"
poll_seconds = 60
dry_run = true            # true: only log decisions, never run agents or write to GitHub. Set false to go live.
confidence_threshold = 0.6   # below this the classifier's call goes to a person on Telegram

[github]
token_file = "/srv/factory/secrets/github_token"   # without a token every trust check fails closed
trigger_label = "factory:ready"                    # "build it": agents edit the repos and open PRs
repos = ["your-org/standalone-service"]            # repos handled on their own; project members below are added automatically
trusted_permissions = ["admin", "maintain", "write"]   # who may apply a trigger label
# issues_enabled = false  # false: GitHub issues are not read or acted on (no polling, approvals, schedules, sub-issues or Import); pull requests
#                           and CI still use GitHub. Turn the local tracker on below, or set true to work from GitHub issues. A config
#                           without this line keeps working from GitHub issues.
# poll_seconds = 300                                # how often GitHub is read (default: [general] poll_seconds). Local tickets, approvals
#                                                   # and schedules are still handled every [general] poll_seconds.

# The local ticket tracker: tickets kept in the factory's own database (L-1, L-2, ...), and "Import" on the Tickets page, which
# copies a GitHub issue here and marks the original "factory:moved". Off by default.
# [local]
# enabled = true

# Classification tier -> agent settings. A fixed table: the classifier can only select a row, never write one.
[routing.low]
harness = "claude-code"
model = "haiku"
effort = "low"

[routing.medium]
harness = "claude-code"
model = "sonnet"
effort = "medium"

[routing.high]
harness = "claude-code"
model = "opus"
effort = "high"
# Optional, admin-only: models tried in order (same harness and effort, up to 3) when this one is rate limited or the API errors.
# Also valid under [roles.<name>] and [review]. Ticket text and the classifier cannot set or change it.
# fallback_models = ["sonnet"]

[runner]
# Rendered previews of the designer's mockups (PNG screenshots committed to the draft PR). Needs the factory-render image:
#   scripts/deploy.sh user@host --image   (or docker compose --profile build build). Without it, previews are skipped.
# render_previews = true
# render_image = "localhost/factory-render:latest"
# render_timeout_seconds = 120
engine = "podman"                      # "podman" or "docker": the engine that runs sandboxes
image = "localhost/factory-agent:latest"
work_dir = "/srv/factory/work"                      # per-task workspaces (must be the same path on the host in docker mode)
proxy_socket = "/srv/factory/run/proxy.sock"        # the egress proxy socket sandboxes connect to
allow_hosts = ["api.anthropic.com"]    # the only hosts the sandbox can reach. Add package registries only if tasks need installs.
timeout_seconds = 1800
max_turns = 40
claude_env_file = "/srv/factory/secrets/claude.env"   # CLAUDE_CODE_OAUTH_TOKEN=... or ANTHROPIC_API_KEY=...

# Role agents (read-only; their document is posted on the ticket). Defaults shown; override any field.
# [roles.analyst]   label = "factory:analyze"   done_label = "stage:analysed"    model = "sonnet"  effort = "medium"
# [roles.designer]  label = "factory:design"    done_label = "stage:designed"    model = "sonnet"  effort = "medium"
# [roles.architect] label = "factory:architect" done_label = "stage:architected" model = "opus"    effort = "high"
# Designer mockups, set under [roles.designer]: design_files = true / design_dir = "docs/design": the designer also writes static mockups (see docs/architecture.md).
# design_pr = false: keep them in the factory only (the UI, the build and review agents) instead of a draft PR in the repository. Default true.
# [auto]  label = "factory:auto"   # a person applies it and the classifier picks the next stage

[telegram]
token_file = "/srv/factory/secrets/telegram_token"
chat_id = 0   # your numeric Telegram user id; the only account the bot will obey
verbosity = "normal"   # quiet: needs-a-person, failures, rate limits | normal: + PR ready, stage done, CI results | verbose: everything
# events = ["needs_human", "failure", "pr_ready"]   # optional explicit list; overrides verbosity.
# ui_url = "https://factory.example.internal"   # optional: an "Open in UI" button on open-question messages
# All events: needs_human failure rate_limit health pr_ready stage_done ci_result ci_fix recovery worker_offline started startup skipped info

# Slack works alongside Telegram (either, both or neither). Socket Mode: no public URL needed. See README, "Slack".
[slack]
bot_token_file = "/srv/factory/secrets/slack_bot_token"   # xoxb-...  (scope chat:write, commands)
app_token_file = "/srv/factory/secrets/slack_app_token"   # xapp-...  (scope connections:write)
# channel = "C0123ABCDEF"   # the channel (or DM, D...) alerts go to; buttons and /factory are only obeyed there
# user_id = "U0123ABCDEF"   # the only Slack user the factory obeys. Both must be set to turn Slack on
verbosity = "normal"   # as for Telegram
# events = ["needs_human", "failure", "pr_ready"]   # optional explicit list; overrides verbosity
# ui_url = "https://factory.example.internal"   # optional: an "Open in UI" button on open-question messages

[classifier]
backend = "rules"   # "jev" classifies with TypeSafe Jev via OpenRouter; falls back to labels on any error
key_file = "/srv/factory/secrets/openrouter_key"
model = "typesafe/jev-1.13"

# Repos that work together are ONE project: agents get all of them checked out side by side and may change several
# in one task (one PR per changed repo, cross-linked). Each role line tells the agents what the repo is for.
# A repo that PUBLISHES packages other repos install gets `publish`; a repo that installs them names it in `depends_on`. A build
# that changes both then ships in two waves: only the publishing repo's PR is opened; once a person merges it and it is published
# (detect = "release": a GitHub release containing the merge; "tag": a tag; "workflow": a successful run of `workflow` on the
# default branch), the factory builds the depending repos against the published version. The ticket carries
# factory:waiting-release meanwhile. timeout_hours (default 48): alert once if nothing is published that long after the merge.
[[projects]]
name = "shop"
description = "An online shop: a web app with a database backend, native mobile apps and shared UI packages."
repos = [
  { repo = "your-org/shop-web", role = "Web app and database backend (migrations, functions, schema).", depends_on = ["shop-packages"] },
  { repo = "your-org/shop-mobile", role = "Native iOS and Android apps. Models are generated in shop-web and synced here." },
  { repo = "your-org/shop-packages", role = "Shared UI packages, published to GitHub Packages.", publish = { detect = "release", packages = ["@your-org/ui"] } },
]

# Watch the repos' own CI on factory PRs and report it. Needs the GitHub token to have Actions: read
# (Commit statuses: read is optional). fix_rounds = extra agent attempts after a failed run (0 = report only).
[ci]
enabled = true
fix_rounds = 1
wait_for_checks_minutes = 10
timeout_minutes = 90
queued_warn_minutes = 15     # CI queued this long without starting: warn (self-hosted runners may be offline)
manual_wait_hours = 24       # keep watching this long for CI that a person starts by hand (repos with manual-only CI)

# Health watchdog (factory-health.timer, every 5 min; a separate process, so it still alerts when the orchestrator is hung or dead).
# Telegram alert when a check turns bad, a reminder every repeat_hours, and a note when it recovers. Event "health" (shown at every
# verbosity). Checks: free disk and inodes (state, work dir, container storage), free memory, the orchestrator's poll heartbeat,
# stuck runs, a streak of failed runs, the container engine, the egress proxy, secret files, the GitHub token and its rate limit.
# `python3 -m factory.ctl health` prints them all. Every key is optional.
[health]
enabled = true
disk_warn_percent = 15       # free space: warn under this % or under disk_warn_gb, critical under disk_crit_*
disk_crit_percent = 5
disk_warn_gb = 5
disk_crit_gb = 2
# extra_disk_paths = ["/mnt/builds"]
mem_warn_mb = 512
mem_crit_mb = 256
stale_poll_minutes = 10      # no completed poll for this long: the orchestrator is hung or stopped
failed_runs_warn = 5         # this many finished runs in a row all failed
github_rate_warn = 200
repeat_hours = 6
# heartbeat_url = "https://hc-ping.com/your-uuid"   # dead-man's switch: pinged each run while nothing is critical, so the service
#                                                   # (healthchecks.io etc.) alerts you if this whole machine goes quiet

# Mirror each pipeline step of a ticket as a GitHub sub-issue (the UI shows the steps either way).
[subtasks]
enabled = false

# Merge conflicts on factory PRs (build and design), checked whether or not [ci] is on. When a PR conflicts with its base
# branch it is reported once per head commit; with auto = true the factory applies `label` to the ticket itself (a person
# can apply it too). The orchestrator then merges the base branch into the PR branch; if git leaves conflicts, an agent edits
# only the conflicted files and the merge commit is pushed. Never a rebase or a force-push. A conflict in a protected path
# (.github/ ...), a binary file, or a merge that changes .github/workflows/ (the token has no Workflows permission) is left to a person.
[conflicts]
enabled = false
auto = true
label = "factory:fix-conflicts"
max_attempts = 10            # resolution runs per PR; then a person is asked

# Standing instructions of your own for the agents (house style, domain rules, language). Each is put at the top of that
# agent's prompt, `all` first; the factory's built-in rules (read-only, untrusted ticket text, protected paths, no commit,
# the open-questions block) still apply and win if they conflict. Up to 4000 characters each, line breaks and tabs only.
# Also editable on Settings → Agent prompts. Every key is optional; empty means nothing is added.
# [prompts]
# all = "Write in British English."
# analyst = ""
# designer = ""
# architect = ""
# reviewer = ""
# implementer = """
# Prefer small functions.
# Add a test for every bug fix.
# """
# ci_fix = ""                 # CI-fix runs get `all` + this, not the implementer text
# conflicts = ""              # merge-conflict runs likewise

# The project manager: every interval_minutes (and only when the tickets changed) an agent reads each repository's tickets
# that carry a factory trigger or stage label, and ranks them with `priority: high` / `priority: low` labels (the poller already
# starts higher priority first). A priority label a person set, changed or removed always wins. It also records which tickets
# are blocked by others; while it is enabled, a build (`factory:ready` or `factory:auto`) whose blockers are still open waits,
# and so does one whose body has a line like `Blocked by #12`. A person with write access applies unblock_label to ignore the
# project manager's blockers on a ticket. It comments on a ticket only when it changed something. Off by default (a sweep is a
# run per repository).
[pm]
enabled = false
interval_minutes = 360
max_tickets = 40
body_chars = 1500
unblock_label = "factory:unblocked"
model = "sonnet"
effort = "medium"
harness = "claude-code"

# Ticket chat: a person writes about a ticket in the admin UI and gets a quick reply from a short read-only run in a sandbox with
# no repository clone and no GitHub token. The conversation stays in the factory's database (it is never posted to GitHub) and
# later stage runs and reviews see the newest context_turns turns as untrusted data. The chat can only propose sending the ticket
# back to a stage; a signed-in admin confirms it in the UI. It has its own lane (max_parallel) next to runner.max_parallel.
# At most max_per_hour messages per ticket. Off by default (a reply is a model run).
[chat]
enabled = false
harness = "claude-code"
model = "sonnet"
effort = "low"
max_turns = 6
timeout_seconds = 180
max_parallel = 1
check_seconds = 2
max_per_hour = 20
context_turns = 20

# New projects: an agent interviews you in the admin UI (Settings, Projects, Start a new project) about what you want to build and
# recommends a pattern (architecture, stack, tests, where it deploys) from a fixed catalogue. Each reply is a read-only run with no
# repository and no GitHub token; only you start an interview.
[new_projects]
enabled = true
harness = "claude-code"
model = "opus"
effort = "medium"
max_turns = 8
timeout_seconds = 300
max_rounds = 6
max_parallel = 1
check_seconds = 2

# Comment triage: a person with write access (or the admin UI) comments on a ticket the factory already worked on, and a read-only
# agent reads that comment. It can only say: nothing to do, needs a person, send the ticket back to a stage (the redirect the
# admin UI offers), or open a linked follow-up ticket (no labels, so nothing starts by itself). The last two wait for a person to
# confirm in chat. At most max_per_day triage runs per ticket per 24 hours; a comment waits while the ticket has a job or the
# factory is paused. Comments written before you turn it on are never triaged. Off by default (a triage is a run).
[comments]
enabled = false
max_per_day = 3
model = "sonnet"
effort = "medium"
harness = "claude-code"

# What a build needs from the design stage. The designer's rendered mockup images are shown to the build and review agents to match.
# mode "block": a ticket whose design stage should have produced mockups (it ran, and did not say there are no screens) is not built
# without them. "warn" builds anyway and says so on the ticket. "off" never checks. A person puts bypass_label on one ticket to skip.
[mockups]
mode = "block"
bypass_label = "factory:skip-mockup"

# Design exports linked in a ticket body (a single HTML file). The orchestrator fetches https links on these hosts only, with no
# credentials, and hands the content to the agents as untrusted intent; the UI shows it in a sandboxed tab without scripts.
# [design_links]
# enabled = false
# hosts = ["claude.ai"]
# max_links = 3
# max_bytes = 2000000
# ttl_hours = 24

# Tell the UI when a newer release exists (one cached read of the public GitHub releases API every few hours).
# [updates]
# check = true
# repo = "theninjadojo/software-factory"
# token_file = "/srv/factory/secrets/github_token_bot"   # only for a private repo: a token that can read it (default: the [github] token)

# Other models through OpenCode (experimental; build the image with `docker compose --profile opencode build`).
# Enable on the Harnesses page, paste the key there, then route a tier to it. Ticket text never chooses these.
# [harnesses.opencode-openrouter]
# enabled = true
# [routing.low]
# harness = "opencode-openrouter"
# model = "openrouter/qwen/qwen3-coder"
# effort = "low"
# (Big Pickle: enable harnesses.opencode-zen and use harness = "opencode-zen", model = "opencode/big-pickle".)

# Screen verification during a build: after an agent's patch is validated, each listed page is rendered at each viewport in a sealed
# container and compared with baselines committed in that repo (<baseline_dir>/<page>-<viewport>.png). A mismatch, a missing baseline
# or a missing image FAILS the build (nothing is pushed). A patch that changes baselines opens a labelled draft PR for a person.
# Only pages servable offline from the checkout (static HTML/CSS/JS, committed build output). Build the image first:
#   podman build -t factory-screens -f sandbox/screens/Dockerfile sandbox/screens
# [screens]
# image = "localhost/factory-screens:latest"
# timeout_seconds = 300
# baseline_dir = "screens/baselines"
# threshold = 0.1                       # per-pixel colour distance (0..1)
# max_diff_ratio = 0.001                # fraction of pixels allowed to differ (0.1 %)
# viewports = { desktop = { width = 1440, height = 900 }, mobile = { width = 390, height = 844 } }
# [[screens.pages]]
# repo = "your-org/shop-web"
# name = "home"                         # [a-z0-9-]
# path = "site/index.html"              # relative to the repo root
# viewports = ["desktop", "mobile"]     # optional: default is all
# mask = [".clock"]                     # optional CSS selectors of dynamic regions
# wait_for = "main"                     # optional CSS selector
# journey = "checkout"                  # optional: the Screens board shows pages grouped by journey, in step order
# step = 2
# design = "docs/design/checkout-payment.dc.html"   # optional: the design canvas, rendered next to the built screen
# The Screens board (Screens in the UI) shoots every page on each repo's default branch, and renders their design canvases,
# when asked there, and on a timer with:
# board_every = "6h"                    # under [screens]

# Playwright runs on the Screens tab: its Build screens button runs a repo's Playwright suite on a worker (needs [workers] below and a worker with
# the playwright-screens recipe: WORKER_RECIPES=screens scripts/setup-worker.sh) and shows the screenshots grouped by project. docs/workers.md
# [[screens.captures]]
# repo = "your-org/shop-web"
# recipe = "playwright-screens"         # a recipe name on the worker (default)
# platform = "any"                      # the platform a worker must declare (default)

# Verification workers: a machine you own (a Mac, a networked Linux box) that checks an agent's patch BEFORE anything is pushed, using
# what the sandbox lacks (Xcode, an emulator, the network for `npm ci`). Pull-based; recipes are defined on the worker, never here.
# Setup: enable this (or Settings -> Workers in the UI, which then starts the worker API itself), add a worker, run worker/worker.py there. docs/workers.md
# [workers]
# enabled = true
# listen = "127.0.0.1:8788"                           # the worker API; put TLS or a VPN / SSH tunnel in front of it
# tokens_file = "/srv/factory/secrets/worker_tokens"  # "name token" per line, mode 0600
# mode = "block"                                      # block: a failing or missing check fails the run; warn: push anyway and say so
# lease_seconds = 120
# claim_wait_seconds = 900                            # a job no worker claims in this time fails
# max_wait_seconds = 3600
# fix_rounds = 1                                      # extra agent attempts, with the failing log, when a required check FAILS (0 = report only)
# [[workers.checks]]
# repo = "your-org/shop-mobile"
# recipe = "ios-test"                                 # a recipe name on the worker
# platform = "macos"                                  # "any" matches every worker
# required = true                                     # false: advisory, a failure is noted on the PR but never blocks
# [[workers.lockfiles]]                               # a second build (after a package was published): refresh this repo's lockfiles on a
# repo = "your-org/shop-web"                          # worker with the lockfile-update recipe, so CI installs the new version (docs/workers.md)

# Scheduled jobs (docs/schedules.md): on a timer, fetch data, keep a snapshot, open a ticket carrying it. With the default
# labels the ticket gets the auto label: the analyst proposes changes and the classifier decides whether to build them.
# [[schedules]]
# name = "umami-weekly"
# repo = "your-org/shop-web"
# every = "7d"                         # or cron = "0 9 * * 1" (UTC). Never run retroactively: the clock starts when first seen.
# title = "Weekly analytics review ${date}"
# instructions = "Look for pages with falling traffic or high drop-off and propose concrete changes."   # optional
# # labels = ["factory:analyze"]       # default is the [auto] label; [] opens a ticket nobody acts on
# # skip_if_open = true                # no new ticket while the last one is still open
# [schedules.source]
# type = "umami"                       # or "http" for any HTTPS JSON endpoint
# base_url = "https://api.umami.is/v1" # self-hosted: https://umami.example.com/api with auth = "bearer"
# website_id = "00000000-0000-0000-0000-000000000000"
# token_file = "/srv/factory/secrets/umami_key"
# days = 7
# metrics = ["path", "referrer", "browser", "device", "country"]

# Code-smell scans (docs/scanner.md): on a timer a worker reads a repo for smells and the factory opens one ticket per smell.
# Needs [workers] enabled and a worker with the smell-scan recipe (worker/recipes/smell-scan.py). Presets: todo-debt, long-files, missing-tests, hardcoded-secret, dynamic-eval, shell-injection, tls-verify-off, weak-hash, sql-concat, long-parameter-list, deep-nesting.
# [scanner]
# enabled = false
# max_tickets = 5                      # opened per scan run
# # labels = ["factory:analyze"]       # default is the analyst role's label: analysed, not built
# [[scanner.smells]]                   # a custom smell: a regex per line, in files matching globs
# id = "no-print"
# name = "Debug prints"
# pattern = '^\s*print\('
# globs = ["**/*.py"]
# advice = "Use the logging module."       # optional recommended fix, shown on every ticket for this smell (trusted text, at most 2000 characters)
# [scanner.advice]                     # the same for a preset, keyed by its id
# todo-debt = "Turn each TODO into a ticket, or delete it."
# [[scanner.scans]]
# name = "shop-web-weekly"
# repo = "your-org/shop-web"
# every = "1w"                         # or cron = "0 6 * * 1" (UTC); at least 1h. The clock starts when first seen.
# smells = ["todo-debt", "long-files", "missing-tests", "no-print"]
# exclude = ["vendor/**", "**/*.min.js"]
