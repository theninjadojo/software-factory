# software-factory example configuration. Copy to config.toml and edit. Paths assume the native install
# under /srv/factory; the docker-compose stack maps the same paths (see README).

[general]
db_path = "/srv/factory/state/factory.db"
poll_seconds = 60
dry_run = true            # true: only log decisions, never run agents or write to GitHub. Set false to go live.
confidence_threshold = 0.6   # below this the classifier's call goes to a person on Telegram

[github]
token_file = "/srv/factory/secrets/github_token"   # without a token every trust check fails closed
trigger_label = "factory:ready"                    # "build it": agents edit the repos and open PRs
repos = ["your-org/standalone-service"]            # repos handled on their own; project members below are added automatically
trusted_permissions = ["admin", "maintain", "write"]   # who may apply a trigger label

# Classification tier -> agent settings. A fixed table: the classifier can only select a row, never write one.
[routing.low]
harness = "claude-code"
model = "haiku"
effort = "low"

[routing.medium]
harness = "claude-code"
model = "sonnet"
effort = "medium"

[routing.high]
harness = "claude-code"
model = "opus"
effort = "high"

[runner]
# Rendered previews of the designer's mockups (PNG screenshots committed to the draft PR). Needs the factory-render image:
#   scripts/deploy.sh user@host --image   (or docker compose --profile build build). Without it, previews are skipped.
# render_previews = true
# render_image = "localhost/factory-render:latest"
# render_timeout_seconds = 120
engine = "podman"                      # "podman" or "docker": the engine that runs sandboxes
image = "localhost/factory-agent:latest"
work_dir = "/srv/factory/work"                      # per-task workspaces (must be the same path on the host in docker mode)
proxy_socket = "/srv/factory/run/proxy.sock"        # the egress proxy socket sandboxes connect to
allow_hosts = ["api.anthropic.com"]    # the only hosts the sandbox can reach. Add package registries only if tasks need installs.
timeout_seconds = 1800
max_turns = 40
claude_env_file = "/srv/factory/secrets/claude.env"   # CLAUDE_CODE_OAUTH_TOKEN=... or ANTHROPIC_API_KEY=...

# Role agents (read-only; their document is posted on the ticket). Defaults shown; override any field.
# [roles.analyst]   label = "factory:analyze"   done_label = "stage:analysed"    model = "sonnet"  effort = "medium"
# [roles.designer]  label = "factory:design"    done_label = "stage:designed"    model = "sonnet"  effort = "medium"
# [roles.architect] label = "factory:architect" done_label = "stage:architected" model = "opus"    effort = "high"
# [auto]  label = "factory:auto"   # a person applies it and the classifier picks the next stage

[telegram]
token_file = "/srv/factory/secrets/telegram_token"
chat_id = 0   # your numeric Telegram user id; the only account the bot will obey
verbosity = "normal"   # quiet: needs-a-person, failures, rate limits | normal: + PR ready, stage done, CI results | verbose: everything
# events = ["needs_human", "failure", "pr_ready"]   # optional explicit list; overrides verbosity.
# ui_url = "https://factory.example.internal"   # optional: an "Open in UI" button on open-question messages
# All events: needs_human failure rate_limit pr_ready stage_done ci_result ci_fix recovery started startup skipped info

[classifier]
backend = "rules"   # "jev" classifies with TypeSafe Jev via OpenRouter; falls back to labels on any error
key_file = "/srv/factory/secrets/openrouter_key"
model = "typesafe/jev-1.13"

# Repos that work together are ONE project: agents get all of them checked out side by side and may change several
# in one task (one PR per changed repo, cross-linked). Each role line tells the agents what the repo is for.
[[projects]]
name = "shop"
description = "An online shop: a web app with a database backend, native mobile apps and shared UI packages."
repos = [
  { repo = "your-org/shop-web", role = "Web app and database backend (migrations, functions, schema)." },
  { repo = "your-org/shop-mobile", role = "Native iOS and Android apps. Models are generated in shop-web and synced here." },
  { repo = "your-org/shop-packages", role = "Shared UI packages used by the web app." },
]

# Watch the repos' own CI on factory PRs and report it. Needs the GitHub token to have Actions: read
# (Commit statuses: read is optional). fix_rounds = extra agent attempts after a failed run (0 = report only).
[ci]
enabled = true
fix_rounds = 1
wait_for_checks_minutes = 10
timeout_minutes = 90
queued_warn_minutes = 15     # CI queued this long without starting: warn (self-hosted runners may be offline)
manual_wait_hours = 24       # keep watching this long for CI that a person starts by hand (repos with manual-only CI)

# Mirror each pipeline step of a ticket as a GitHub sub-issue (the UI shows the steps either way).
[subtasks]
enabled = false

# Merge conflicts on factory PRs (build and design), checked whether or not [ci] is on. When a PR conflicts with its base
# branch it is reported once per head commit; with auto = true the factory applies `label` to the ticket itself (a person
# can apply it too). The orchestrator then merges the base branch into the PR branch; if git leaves conflicts, an agent edits
# only the conflicted files and the merge commit is pushed. Never a rebase or a force-push. A conflict in a protected path
# (.github/ ...), a binary file, or a merge that changes .github/workflows/ (the token has no Workflows permission) is left to a person.
[conflicts]
enabled = false
auto = true
label = "factory:fix-conflicts"
max_attempts = 10            # resolution runs per PR; then a person is asked

# Standing instructions of your own for the agents (house style, domain rules, language). Each is put at the top of that
# agent's prompt, `all` first; the factory's built-in rules (read-only, untrusted ticket text, protected paths, no commit,
# the open-questions block) still apply and win if they conflict. Up to 4000 characters each, line breaks and tabs only.
# Also editable on Settings → Agent prompts. Every key is optional; empty means nothing is added.
# [prompts]
# all = "Write in British English."
# analyst = ""
# designer = ""
# architect = ""
# reviewer = ""
# implementer = """
# Prefer small functions.
# Add a test for every bug fix.
# """
# ci_fix = ""                 # CI-fix runs get `all` + this, not the implementer text
# conflicts = ""              # merge-conflict runs likewise

# Other models through OpenCode (experimental; build the image with `docker compose --profile opencode build`).
# Enable on the Harnesses page, paste the key there, then route a tier to it. Ticket text never chooses these.
# [harnesses.opencode-openrouter]
# enabled = true
# [routing.low]
# harness = "opencode-openrouter"
# model = "openrouter/qwen/qwen3-coder"
# effort = "low"
# (Big Pickle: enable harnesses.opencode-zen and use harness = "opencode-zen", model = "opencode/big-pickle".)
