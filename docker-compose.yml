# software-factory: orchestrator + egress proxy, with sandboxes started on the host's container engine.
#
#   cp config.example.toml config.toml        # then edit it (see README: set engine = "docker", image = "factory-agent:latest")
#   cp .env.example .env                      # then edit it
#   docker compose --profile build build      # builds the orchestrator image AND the agent sandbox image
#   docker compose up -d
#
# SECURITY: the orchestrator needs the engine socket to start sandboxes. On a rootful Docker that socket is
# root-equivalent on the host. Prefer rootless Docker, or the native systemd install (deploy/systemd) which uses
# rootless Podman. Read SECURITY.md before exposing this anywhere that matters.
name: software-factory

x-common: &common
  image: software-factory:latest
  user: "1000:1000"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped
  tmpfs: ["/tmp"]

services:
  proxy:          # the ONLY way out for sandboxes: tunnels TLS to allowlisted hosts over a unix socket
    <<: *common
    build: .
    command: ["python3", "-m", "factory.proxy", "/etc/factory/config.toml"]
    volumes:
      - ./config.toml:/etc/factory/config.toml:ro
      - ${FACTORY_HOME:-/srv/factory}/run:${FACTORY_HOME:-/srv/factory}/run

  orchestrator:
    <<: *common
    depends_on: [proxy]
    group_add: ["${DOCKER_GID:?set DOCKER_GID to the group id that owns the engine socket, e.g. stat -c %g /var/run/docker.sock}"]
    environment:
      DOCKER_HOST: unix:///var/run/docker.sock
    # Host paths are mounted at the SAME path inside: the engine resolves sandbox bind mounts on the host.
    volumes:
      - ./config.toml:/etc/factory/config.toml:ro
      - ${FACTORY_HOME:-/srv/factory}/secrets:${FACTORY_HOME:-/srv/factory}/secrets:ro
      - ${FACTORY_HOME:-/srv/factory}/state:${FACTORY_HOME:-/srv/factory}/state
      - ${FACTORY_HOME:-/srv/factory}/work:${FACTORY_HOME:-/srv/factory}/work
      - ${FACTORY_HOME:-/srv/factory}/run:${FACTORY_HOME:-/srv/factory}/run
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock

  sandbox-image:  # build-only: `docker compose --profile build build` produces factory-agent:latest
    build: ./sandbox
    image: factory-agent:latest
    profiles: ["build"]
    entrypoint: ["true"]

  sandbox-image-codex:   # EXPERIMENTAL: `docker compose --profile codex build` produces factory-agent-codex:latest
    build: {context: ./sandbox, dockerfile: codex/Dockerfile}
    image: factory-agent-codex:latest
    profiles: ["codex"]
    entrypoint: ["true"]

  sandbox-image-gemini:  # EXPERIMENTAL: `docker compose --profile gemini build` produces factory-agent-gemini:latest
    build: {context: ./sandbox, dockerfile: gemini/Dockerfile}
    image: factory-agent-gemini:latest
    profiles: ["gemini"]
    entrypoint: ["true"]
