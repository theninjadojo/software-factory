[project]
name = "shikumi-app"
version = "0.1.0"
description = "Shikumi App: the HTTP API, its worker and its database migrations."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "fastapi>=0.142.3",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.1.4",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT"]
ignore = ["S101"]  # assert is how pytest checks

[tool.mypy]
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
