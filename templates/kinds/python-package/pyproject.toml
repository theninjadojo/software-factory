[project]
name = "shikumi-app"
version = "0.1.0"
description = "Shikumi App."
readme = "README.md"
authors = [{ name = "shikumi-org" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.27.3",
]

[project.scripts]
shikumi-app = "shikumi_app._cli:app"

[project.urls]
Source = "https://github.com/shikumi-org/shikumi-app"
Changelog = "https://github.com/shikumi-org/shikumi-app/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --cov --cov-report=term-missing"

[tool.coverage.run]
source = ["shikumi_app"]
branch = true

[tool.coverage.report]
fail_under = 90
exclude_also = ["if __name__ == .__main__.:"]
