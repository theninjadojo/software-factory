# Fly.io app configuration: https://fly.io/docs/reference/configuration/
app = "shikumi-app"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Applies new database migrations before the new version takes traffic.
  release_command = "node scripts/migrate.mjs"

[env]
  BETTER_AUTH_URL = "https://shikumi-app.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
