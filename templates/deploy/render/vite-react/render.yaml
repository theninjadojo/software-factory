# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: shikumi-app
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    # Deploys come from the Deploy workflow's deploy hook, after CI passes on main.
    autoDeployTrigger: "off"
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      # Client-side routes: any path that is not a file gets index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
