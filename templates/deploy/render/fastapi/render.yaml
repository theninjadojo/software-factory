# Render Blueprint. See DEPLOY.md. Both services build the Dockerfile; the Deploy workflow starts their deploys after CI passes.
services:
  - type: web
    name: shikumi-app
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    # Runs before each deploy of the API goes live; a failure stops the deploy.
    preDeployCommand: alembic upgrade head
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shikumi-app-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false
      - key: LOG_LEVEL
        value: INFO

  - type: worker
    name: shikumi-app-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m shikumi_app.worker
    autoDeployTrigger: "off"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shikumi-app-db
          property: connectionString
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: shikumi-app-db
    databaseName: shikumi_app
    user: app
    plan: basic-256mb
