<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Shikumi</title>
<style>
html,body{margin:0;width:1280px;height:640px;overflow:hidden}
body{background:#14161c;color:#f3f4f6;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;justify-content:center;padding:0 96px;box-sizing:border-box}
h1{font-size:120px;margin:0;letter-spacing:-2px}
h1 span{color:#8b93a7;font-weight:400;font-size:64px;margin-left:24px}
p{font-size:44px;margin:16px 0 56px;color:#d1d5db}
.row{display:flex;align-items:center;gap:16px;font-size:30px}
.row b{background:#232733;border:2px solid #3b4256;border-radius:14px;padding:14px 24px;font-weight:600}
.row i{color:#8b93a7;font-style:normal}
small{position:absolute;bottom:40px;left:96px;font-size:26px;color:#8b93a7}
</style></head><body>
<h1>Shikumi<span>仕組み</span></h1>
<p>Label an issue. Sandboxed agents ship the PR.</p>
<div class="row"><b>Issue</b><i>→</i><b>Analyse</b><i>→</i><b>Design</b><i>→</i><b>Build</b><i>→</i><b>Pull request</b></div>
<small>No network. No credentials. A person reviews every PR.</small>
</body></html>
