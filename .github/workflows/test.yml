name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:          # release.yml runs these same jobs and publishes only when they pass
# Pull requests from forks run here, so every job uses a GitHub-hosted runner (never the self-hosted one) and a read-only token.
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # the release-guard tests compare against the repository's tags
      # The runner's own python3 (3.12). setup-python's tool-cache build cannot find libpython once a test strips the environment.
      - run: python3 -m unittest discover -s tests
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tests/e2e/requirements.txt && playwright install --with-deps chromium
      - run: pytest tests/e2e
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t software-factory:ci .
      - run: docker run --rm --entrypoint python3 -w /app software-factory:ci -m unittest discover -s tests
      - run: docker compose version
      - run: FACTORY_HOME=/tmp/fh DOCKER_GID=0 docker compose config -q
  # The command-line client (cli/, Rust; docs/cli.md): format, lints, its own tests, a static (musl) build like the release's, and
  # the built binary end to end against a real factory UI (tests/test_cli_e2e.py).
  cli:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v5
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            cli/target
          key: cli-${{ hashFiles('cli/Cargo.lock', 'cli/rust-toolchain.toml') }}
      - run: sudo apt-get install -y musl-tools && rustup show active-toolchain
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked
      - run: cargo build --locked --release --target x86_64-unknown-linux-musl && file target/x86_64-unknown-linux-musl/release/shikumi | grep -q 'static'
      - run: SHIKUMI_CLI_BIN=$PWD/cli/target/debug/shikumi python3 -m unittest tests.test_cli_e2e -v
        working-directory: .
