name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s tests
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t software-factory:ci .
      - run: docker run --rm --entrypoint python3 -w /app software-factory:ci -m unittest discover -s tests
      - run: FACTORY_HOME=/tmp/fh DOCKER_GID=0 docker compose config -q
