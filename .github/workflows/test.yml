name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      # The runner's own python3 (3.12). setup-python's tool-cache build cannot find libpython once a test strips the environment.
      - run: python3 -m unittest discover -s tests
  browser:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/e2e/requirements.txt && playwright install --with-deps chromium
      - run: pytest tests/e2e
  images:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t software-factory:ci .
      - run: docker run --rm --entrypoint python3 -w /app software-factory:ci -m unittest discover -s tests
      - run: FACTORY_HOME=/tmp/fh DOCKER_GID=0 docker compose config -q
