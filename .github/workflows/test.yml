name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
# Pull requests from forks run here, so every job uses a GitHub-hosted runner (never the self-hosted one) and a read-only token.
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0      # the release-guard tests compare against the repository's tags
      # The runner's own python3 (3.12). setup-python's tool-cache build cannot find libpython once a test strips the environment.
      - run: python3 -m unittest discover -s tests
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r tests/e2e/requirements.txt && playwright install --with-deps chromium
      - run: pytest tests/e2e
  images:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t software-factory:ci .
      - run: docker run --rm --entrypoint python3 -w /app software-factory:ci -m unittest discover -s tests
      - run: docker compose version
      - run: FACTORY_HOME=/tmp/fh DOCKER_GID=0 docker compose config -q
