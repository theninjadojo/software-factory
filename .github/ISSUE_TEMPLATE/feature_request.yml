name: Feature request
description: Suggest something Shikumi should do.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you are trying to do, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you would like
  - type: textarea
    id: security
    attributes:
      label: Trust boundaries
      description: Does this change what an agent can see or reach, or what the factory may write to GitHub? See SECURITY.md.
